<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player · pagepad</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    main { flex: 1; width: min(560px, 100%); margin: 0 auto; padding: 56px 20px; }
    .now { margin-bottom: 28px; }
    .now h1 { font-size: 40px; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 6px; }
    .now p { margin: 0; color: var(--muted); }
    .track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 24px 0 8px; }
    .track div { height: 100%; width: 0; background: var(--fg); }
    .time { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 8px; margin: 24px 0 40px; }
    .controls .btn { flex: 1; height: 44px; }
    ol { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); counter-reset: t; }
    li { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); color: var(--muted); cursor: pointer; }
    li.current { color: var(--fg); font-weight: 600; }
    .meta { display: flex; gap: 16px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="crumb" href="./">pagepad / <strong>Player</strong></a>
    <button type="button" class="btn" id="pair">Pair phone</button>
  </div>
  <main>
    <div class="now">
      <h1 id="title">Low Tide</h1>
      <p id="sub"></p>
      <div class="track"><div id="progress"></div></div>
      <div class="time"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button type="button" class="btn" id="prev">Previous</button>
      <button type="button" class="btn primary" id="toggle">Play</button>
      <button type="button" class="btn" id="next">Next</button>
    </div>
    <ol id="list"></ol>
    <div class="meta hint"><span id="vol"></span><span id="fadeLabel"></span><span id="sound"></span></div>
  </main>
  <script type="module">
    import { createHost } from '/pagepad/host/index.js'

    // Four short pieces synthesised in the browser, so the demo ships no audio files.
    const SECONDS = 24
    const tracks = [
      { title: 'Low Tide', bpm: 84, root: 57, chords: [[0, 4, 7], [-3, 0, 4], [5, 9, 12], [7, 11, 14]] },
      { title: 'Paper Lanterns', bpm: 96, root: 60, chords: [[0, 3, 7], [5, 8, 12], [-2, 2, 5], [3, 7, 10]] },
      { title: 'Night Bus', bpm: 72, root: 50, chords: [[0, 7, 10], [5, 9, 12], [3, 7, 10], [-2, 2, 7]] },
      { title: 'Morning Glass', bpm: 108, root: 62, chords: [[0, 4, 9], [5, 9, 12], [2, 5, 9], [7, 11, 14]] },
    ]
    const player = { tracks, index: 0, playing: false, volume: 0.7, fade: true }
    window.__player = player

    let ctx, gain, source, startedAt = 0, offset = 0
    const buffers = []

    function synth(t) {
      const sr = ctx.sampleRate
      const buf = ctx.createBuffer(2, sr * SECONDS, sr)
      const [L, R] = [buf.getChannelData(0), buf.getChannelData(1)]
      const step = 60 / t.bpm / 2
      const hz = (n) => 440 * 2 ** ((n - 69) / 12)
      for (let i = 0; i * step < SECONDS; i++) {
        const chord = t.chords[Math.floor(i / 8) % t.chords.length]
        const note = t.root + chord[i % 3] + (i % 8 === 7 ? 12 : 0)
        const f = hz(note), start = Math.floor(i * step * sr), len = Math.floor(step * 3 * sr)
        const pan = (i % 3) / 2
        for (let s = 0; s < len && start + s < L.length; s++) {
          const x = s / sr, env = Math.exp(-x * 3.2) * Math.min(1, x * 200)
          const v = (Math.sin(2 * Math.PI * f * x) + 0.25 * Math.sin(4 * Math.PI * f * x)) * env * 0.16
          L[start + s] += v * (1 - pan * 0.6)
          R[start + s] += v * (0.4 + pan * 0.6)
        }
      }
      const bass = hz(t.root - 12)
      for (let s = 0; s < L.length; s++) {
        const v = Math.sin(2 * Math.PI * bass * (s / sr)) * 0.05
        L[s] += v; R[s] += v
      }
      return buf
    }

    const ensure = () => {
      if (ctx) return
      ctx = new AudioContext()
      gain = ctx.createGain()
      gain.connect(ctx.destination)
    }
    const position = () => (player.playing && ctx ? ctx.currentTime - startedAt : offset)
    const FADE = 1.2

    function startSource() {
      ensure()
      ctx.resume()
      buffers[player.index] ??= synth(tracks[player.index])
      const src = ctx.createBufferSource()
      src.buffer = buffers[player.index]
      src.connect(gain)
      src.onended = () => { if (source === src && player.playing) step(1) }
      src.start(0, offset)
      startedAt = ctx.currentTime - offset
      source = src
      const now = ctx.currentTime
      gain.gain.cancelScheduledValues(now)
      gain.gain.setValueAtTime(player.fade ? 0 : player.volume, now)
      if (player.fade) gain.gain.linearRampToValueAtTime(player.volume, now + FADE)
    }

    function stopSource(fade) {
      if (!source) return
      const src = source
      source = undefined
      if (fade && ctx) {
        const now = ctx.currentTime
        gain.gain.cancelScheduledValues(now)
        gain.gain.setValueAtTime(gain.gain.value, now)
        gain.gain.linearRampToValueAtTime(0, now + FADE)
        src.stop(now + FADE)
      } else src.stop()
    }

    function toggle() {
      if (player.playing) { offset = position(); stopSource(player.fade); player.playing = false }
      else { player.playing = true; startSource() }
      render()
    }

    function step(d) {
      const wasPlaying = player.playing
      stopSource(false)
      player.index = (player.index + d + tracks.length) % tracks.length
      offset = 0
      if (wasPlaying) startSource()
      render()
    }

    function setVolume(v) {
      player.volume = Math.min(1, Math.max(0, v))
      if (gain && player.playing) gain.gain.setTargetAtTime(player.volume, ctx.currentTime, 0.05)
      render()
    }

    const host = await createHost({ endpoint: '/api/pad' })
    window.__pagepad = host
    // Re-declared on every render so the phone's play button reads Play or Pause.
    const controls = () => ({
      prev: { button: 'Previous' },
      toggle: { button: player.playing ? 'Pause' : 'Play' },
      next: { button: 'Next' },
      volume: { slider: [0, 100] },
      fade: { toggle: 'Fade in and out' },
    })
    host.on('toggle', toggle)
    host.on('prev', () => step(-1))
    host.on('next', () => step(1))
    host.on('volume', (v) => setVolume(Number(v) / 100))
    host.on('fade', (v) => { player.fade = v === true; render() })

    const $ = (id) => document.getElementById(id)
    const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`

    function render() {
      const t = tracks[player.index]
      $('title').textContent = t.title
      $('sub').textContent = `Track ${player.index + 1} of ${tracks.length} · ${player.playing ? 'Playing' : 'Paused'}`
      $('toggle').textContent = player.playing ? 'Pause' : 'Play'
      $('vol').textContent = `Volume ${Math.round(player.volume * 100)}`
      $('fadeLabel').textContent = player.fade ? 'Fade on' : 'Fade off'
      $('dur').textContent = clock(SECONDS)
      $('list').replaceChildren(...tracks.map((tr, i) => {
        const li = document.createElement('li')
        li.className = i === player.index ? 'current' : ''
        li.append(tr.title, Object.assign(document.createElement('span'), { textContent: clock(SECONDS) }))
        li.addEventListener('click', () => step(i - player.index))
        return li
      }))
      host.controls(controls())
      host.setState({
        title: t.title,
        subtitle: $('sub').textContent,
        volume: Math.round(player.volume * 100),
        fade: player.fade,
        playing: player.playing,
      })
    }

    function frame() {
      const p = Math.min(position(), SECONDS)
      $('progress').style.width = `${(p / SECONDS) * 100}%`
      $('pos').textContent = clock(p)
      $('sound').textContent = player.playing && ctx?.state === 'suspended' ? 'Click the page once to allow sound' : ''
      requestAnimationFrame(frame)
    }

    $('toggle').addEventListener('click', toggle)
    $('prev').addEventListener('click', () => step(-1))
    $('next').addEventListener('click', () => step(1))
    $('pair').addEventListener('click', () => host.showQR())
    addEventListener('pointerdown', () => ctx?.resume())
    render()
    frame()
    host.showQR()
  </script>
</body>
</html>
